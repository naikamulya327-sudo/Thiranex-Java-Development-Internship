<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Amulya Vinod Naik</title>

    <meta name="description"
          content="Contact Amulya Vinod Naik for web development and technology-related opportunities.">

    <meta name="author" content="Amulya Vinod Naik">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Contact Me</h1>
        <p>Let's Connect</p>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main>

        <section aria-labelledby="contact-heading">
            <h2 id="contact-heading">Get in Touch</h2>

            <p>
                If you would like to connect with me regarding projects,
                learning opportunities, or web development, feel free to
                send me a message.
            </p>

            <form action="#" method="post" aria-label="Contact form">

                <div>
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <br>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Amulya Vinod Naik. All rights reserved.</p>
    </footer>

</body>
</html>
